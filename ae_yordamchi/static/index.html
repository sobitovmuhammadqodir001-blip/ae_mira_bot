<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AE Yordamchi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#071426;color:#e9f2ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #34516d;background:#172c46;color:#e9f2ff;border-radius:13px;padding:12px 16px}button:hover{background:#224466}button:focus-visible,input:focus-visible{outline:3px solid #36d7ec;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}.layout{height:100dvh;display:grid;grid-template-columns:250px 1fr;background:radial-gradient(at 100% 0%,#1d2151,transparent 45%)}aside{padding:25px 16px;border-right:1px solid #27415b;overflow:auto;background:#0b1a30}h1{font-size:22px;margin:0 0 6px}.brand{color:#62dcf4;font-weight:900;font-size:40px;font-style:italic;margin-bottom:23px}.muted{color:#a6b9d1;font-size:13px}.new{width:100%;background:linear-gradient(110deg,#087f9b,#295ac8);margin:18px 0}.topic{display:block;width:100%;margin:8px 0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topic[aria-current=true]{border-color:#48d4ed;background:#173852}.workspace{min-width:0;display:flex;flex-direction:column;overflow:hidden}header{padding:22px 28px;border-bottom:1px solid #27415b;display:flex;justify-content:space-between;gap:12px;align-items:center}header h1{font-size:23px}.messages{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px}.bubble{max-width:85%;line-height:1.65;border:1px solid #324966;padding:17px 21px;border-radius:20px;background:#152945;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:linear-gradient(110deg,#087e9f,#185691)}.empty{margin:auto;max-width:470px;text-align:center}.empty h2{font-size:30px}.empty p{color:#a6b9d1;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 24px}.actions button{font-size:13px;padding:10px}form{display:flex;gap:10px;padding:12px 24px}input{width:100%;min-width:0;background:#11243c;color:#fff;border:1px solid #36526b;border-radius:15px;padding:17px}#send{background:#0786ab}#status{min-height:25px;margin:0;padding:0 24px 8px;color:#afddea;font-size:13px}footer{padding:2px 24px 13px;font-size:11px;color:#91a3bc}audio{width:min(100%,460px);margin:5px 24px}#mobileMenu{display:none}@media(max-width:650px){.layout{grid-template-columns:1fr}aside{display:none;position:absolute;inset:75px 20% 0 0;z-index:2;box-shadow:20px 0 60px #0008}.layout.open aside{display:block}header{padding:16px}header h1{font-size:19px}#mobileMenu{display:block}.messages{padding:16px}.bubble{max-width:95%;padding:13px 16px}.actions,form{padding:8px 14px}.actions button{padding:9px;font-size:12px}#rename{font-size:12px;padding:9px}form input{padding:13px}}
</style>
</head>
<body><div class="layout" id="layout">
<aside><div class="brand">AE</div><h1>Mavzular</h1><p class="muted">Suhbatlaringiz bir joyda</p><button class="new" id="new">＋ Yangi mavzu</button><nav id="topics" aria-label="Mavzular"></nav></aside>
<section class="workspace"><header><button id="mobileMenu" aria-label="Mavzularni ochish">☰</button><div><h1>AE Yordamchi</h1><span class="muted">AI yordamchingiz</span></div><button id="rename">Nomlash</button></header>
<main class="messages" id="messages" aria-live="polite"><div class="empty"><div class="brand">AE</div><h2>Bugun nimadan boshlaymiz?</h2><p>Savol bering, reja tuzing yoki fikringizni tartibga soling. Ovozli xabarni bot chatiga yuborishingiz mumkin.</p></div></main>
<div class="actions"><button id="sample">🎙 Siz yuborgan ovoz</button><button id="tts">🔊 Javobni tinglash</button><button id="pdf">📄 PDF qilish</button></div>
<audio id="audio" controls hidden></audio>
<form id="form"><input id="text" maxlength="12000" placeholder="Xabar yozing…" aria-label="Xabar" autocomplete="off"><button id="send" type="submit" aria-label="Yuborish">➤</button></form>
<p id="status" role="status"></p><footer>AE Corporation · @sobitovv_o8</footer></section></div>
<script>
'use strict';
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id);let current=null,busy=false,audioUrl=null;
async function api(action,{method='GET',data=null}={}){
 const r=await fetch('/api/'+action,{method,headers:{'X-Telegram-Init-Data':tg?.initData||'','Content-Type':'application/json'},body:data?JSON.stringify(data):null});
 if(!r.ok){const body=await r.text();try{throw new Error(JSON.parse(body).xato||body)}catch(e){if(e instanceof SyntaxError)throw new Error(body);throw e}}
 return r;
}
function status(text){$('status').textContent=text}
function bubble(role,text){const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight}
function setBusy(v){busy=v;for(const id of ['new','rename','send','tts','pdf','text'])$(id).disabled=v}
async function topics(){const rows=await(await api('topics')).json();if(!current)current=rows[0]?.id;$('topics').replaceChildren();for(const t of rows){const b=document.createElement('button');b.className='topic';b.textContent=t.title;b.setAttribute('aria-current',String(t.id===current));b.onclick=async()=>{if(busy)return;current=t.id;$('layout').classList.remove('open');try{await topics();await history()}catch(e){status(e.message)}};$('topics').append(b)}}
async function history(){const rows=await(await api('messages?topic='+current)).json();$('messages').replaceChildren();if(!rows.length)bubble('assistant','Assalomu alaykum! Yangi mavzu ochildi. Savolingizni yozing.');for(const m of rows)bubble(m.role,m.text)}
$('form').onsubmit=async e=>{e.preventDefault();const text=$('text').value.trim();if(!text||busy||!current)return;setBusy(true);$('text').value='';bubble('user',text);status('O‘ylayapman…');try{const r=await(await api('chat',{method:'POST',data:{topic:current,text}})).json();bubble('assistant',r.text);await topics();status('Javob tayyor.')}catch(e){status(e.message);$('text').value=text}finally{setBusy(false);$('text').focus()}};
$('new').onclick=async()=>{if(busy)return;try{const r=await(await api('new',{method:'POST',data:{}})).json();current=r.id;await topics();await history();$('layout').classList.remove('open')}catch(e){status(e.message)}};
$('rename').onclick=async()=>{if(busy||!current)return;const title=prompt('Mavzuning yangi nomi:');if(!title?.trim())return;try{await api('rename',{method:'POST',data:{topic:current,title}});await topics()}catch(e){status(e.message)}};
function play(src){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=src;$('audio').src=src;$('audio').hidden=false;$('audio').play().catch(()=>status('Ovozni eshitish uchun ijro tugmasini bosing.'))}
$('sample').onclick=()=>play('/audio/namuna.mp3');
$('tts').onclick=async()=>{if(busy||!current)return;setBusy(true);status('Ovoz tayyorlanmoqda…');try{const r=await api('tts',{method:'POST',data:{topic:current}});play(URL.createObjectURL(await r.blob()));status('Ovoz tayyor.')}catch(e){status(e.message)}finally{setBusy(false)}};
$('pdf').onclick=async()=>{if(busy||!current)return;try{const r=await api('pdf?topic='+current);const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='AE_javob.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status('PDF tayyor. Yuklab olish qurilmangizga bog‘liq; botdagi PDF tugmasi ham mavjud.')}catch(e){status(e.message)}};
$('mobileMenu').onclick=()=>$('layout').classList.toggle('open');
if(!tg?.initData){status('Bu himoyalangan Mini App. Uni Telegram botidagi “Ilovani ochish” tugmasidan oching.');setBusy(true)}else{(async()=>{try{await topics();await history()}catch(e){status(e.message);setBusy(true)}})()}
</script></body></html>
